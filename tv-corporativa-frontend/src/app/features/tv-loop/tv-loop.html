<div class="tv-container">

  <video 
    #videoPlayer
    [src]="videoUrlAtual"
    (ended)="proximoVideo()"
    (error)="tratarErroVideo($event)"
    autoplay
    muted
    playsinline
    preload="auto"
    class="fullscreen-video"
    [style.display]="videoUrlAtual ? 'block' : 'none'">
  </video>

  <div *ngIf="!videoUrlAtual" class="carregando">
    <div class="spinner"></div>
    <h2>Buscando playlist da TV ARSAL... 📡</h2>
  </div>

</div>
